# מודל הסיווג (רק אם הוגדר ANTHROPIC_API_KEY כ-secret)
model: claude-haiku-5-5

# שינוי מוחל אוטומטית רק אם לפחות כך מקבוצות תקשורת שונות מאשרות אותו
min_independent_sources: 2

# כמה ימים אחורה מצרפים כותרות לאותו אירוע
lookback_days: 10

# שמות נוספים שבהם מופיעים אנשים בכותרות (הראשון = השם כפי שהוא ב-state.yaml)
