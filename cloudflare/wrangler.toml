# Cloudflare Worker for memshala.gabimansour.com. Deploy with:  cd cloudflare && wrangler deploy
# Cloudflare created the DNS record and the HTTPS certificate for the custom domain itself.
name = "memshala-2026"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "memshala.gabimansour.com", custom_domain = true },
]

# live data (Knesset + news) refreshed every 10 minutes and served at /live.json
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "LIVE"
id = "45e67053eaba42a08c68333376affabb"
